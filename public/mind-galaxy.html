<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心智星系 Mind Galaxy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import { ApiClient } from './js/api.js';
  window.ApiClient = ApiClient;
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

*, *::before, *::after { box-sizing: border-box; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; }

:root {
  --bg-deep: hsl(240, 20%, 4%);
  --panel-bg: hsla(240, 20%, 8%, 0.85);
  --panel-border: hsla(260, 30%, 40%, 0.3);
  --text-primary: hsl(240, 10%, 92%);
  --text-secondary: hsl(240, 8%, 65%);
  --text-muted: hsl(240, 6%, 45%);
  --accent-gold: hsl(42, 85%, 60%);
  --accent-blue: hsl(210, 80%, 65%);
  --accent-purple: hsl(270, 60%, 65%);
  --accent-rose: hsl(350, 70%, 65%);
  --danger: hsl(0, 70%, 60%);
  --success: hsl(140, 55%, 55%);
}

body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg-deep);
  font-family: 'Noto Serif SC', 'Space Mono', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}

#canvas-container canvas {
  display: block;
}

/* Loading Screen */
#loading-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease;
}
#loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text-primary);
  margin-bottom: 2rem;
}
.loading-subtitle {
  font-size: 0.85rem;
  color: var(--text-secondary);
  letter-spacing: 0.2em;
  margin-bottom: 2.5rem;
}
.loading-bar-track {
  width: 240px;
  height: 2px;
  background: hsla(260, 30%, 30%, 0.5);
  border-radius: 1px;
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue), var(--accent-gold));
  border-radius: 1px;
  transition: width 0.3s ease;
  width: 0%;
}
.loading-percent {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 1rem;
  letter-spacing: 0.1em;
}

/* Top Bar */
#top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}
#top-bar > * {
  pointer-events: auto;
}
.top-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.top-logo svg {
  width: 28px;
  height: 28px;
  color: var(--accent-gold);
}
.top-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-primary);
}
.top-controls {
  display: flex;
  gap: 0.5rem;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 2rem;
  padding: 0.35rem;
}
.ctrl-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  position: relative;
}
.ctrl-btn:hover {
  color: var(--text-primary);
  background: hsla(260, 30%, 40%, 0.3);
}
.ctrl-btn.active {
  color: var(--accent-gold);
  background: hsla(42, 85%, 60%, 0.15);
}
.ctrl-btn svg {
  width: 18px;
  height: 18px;
}
.ctrl-tooltip {
  position: absolute;
  bottom: -2rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--text-muted);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.ctrl-btn:hover .ctrl-tooltip {
  opacity: 1;
}

/* Left Panel */
#left-panel {
  position: fixed;
  left: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 320px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 1rem;
  padding: 1.5rem;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
}
#left-panel.collapsed {
  transform: translateY(-50%) translateX(calc(-100% - 2rem));
  opacity: 0;
  pointer-events: none;
}
.panel-toggle {
  position: absolute;
  right: -2.5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--panel-border);
  background: var(--panel-bg);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.panel-toggle:hover {
  color: var(--text-primary);
  border-color: var(--accent-gold);
}
.panel-label {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.panel-label svg {
  width: 16px;
  height: 16px;
  color: var(--accent-gold);
}

/* Data Source Section */
.data-source-section {
  margin-bottom: 1rem;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
}
.section-title svg {
  width: 14px;
  height: 14px;
  color: var(--accent-purple);
}
.data-source-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
}
.data-source-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  padding: 0.75rem 0.5rem;
  background: hsla(240, 20%, 12%, 0.6);
  border: 1px solid var(--panel-border);
  border-radius: 0.65rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Noto Serif SC', serif;
}
.data-source-btn:hover {
  background: hsla(260, 30%, 30%, 0.4);
  border-color: var(--accent-purple);
  color: var(--text-primary);
  transform: translateY(-2px);
}
.data-source-btn:active {
  transform: translateY(0);
}
.data-source-btn .ds-icon {
  font-size: 1.2rem;
}
.data-source-btn .ds-label {
  font-size: 0.7rem;
  letter-spacing: 0.04em;
}
.import-status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.75rem;
  padding: 0.5rem 0.75rem;
  background: hsla(260, 40%, 30%, 0.2);
  border-radius: 0.5rem;
  font-size: 0.75rem;
  color: var(--accent-purple);
}
.loading-dot {
  width: 8px;
  height: 8px;
  background: var(--accent-purple);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1rem 0;
  color: var(--text-muted);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--panel-border);
}

#diary-input {
  width: 100%;
  min-height: 180px;
  background: hsla(240, 20%, 12%, 0.6);
  border: 1px solid var(--panel-border);
  border-radius: 0.75rem;
  padding: 1rem;
  color: var(--text-primary);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.85rem;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s;
}
#diary-input:focus {
  border-color: var(--accent-purple);
}
#diary-input::placeholder {
  color: var(--text-muted);
}

/* Analyzer Preview */
#analyzer-preview {
  margin-top: 1rem;
  display: none;
}
#analyzer-preview.visible { display: block; }
.ap-warning {
  background: hsla(35, 80%, 50%, 0.12);
  border: 1px solid hsla(35, 80%, 50%, 0.25);
  border-radius: 0.5rem;
  padding: 0.5rem 0.75rem;
  font-size: 0.72rem;
  color: hsl(35, 80%, 70%);
  margin-bottom: 0.75rem;
  line-height: 1.5;
}
.ap-section {
  margin-bottom: 0.75rem;
}
.ap-section-title {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  margin-bottom: 0.4rem;
}
.ap-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}
.ap-keyword {
  padding: 0.2rem 0.5rem;
  background: hsla(260, 30%, 35%, 0.3);
  border-radius: 0.35rem;
  font-size: 0.7rem;
  color: var(--text-secondary);
}
.ap-emotions {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.ap-emotion-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
}
.ap-emotion-name {
  min-width: 4.5rem;
  color: var(--text-secondary);
}
.ap-emotion-bar-track {
  flex: 1;
  height: 4px;
  background: hsla(260, 20%, 30%, 0.3);
  border-radius: 2px;
  overflow: hidden;
}
.ap-emotion-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}
.ap-emotion-score {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  min-width: 2.2rem;
  text-align: right;
}
.ap-char-count {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-align: right;
  margin-top: 0.4rem;
  font-family: 'Space Mono', monospace;
}
.btn-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}
.btn {
  flex: 1;
  padding: 0.65rem 1rem;
  border-radius: 0.75rem;
  border: none;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.btn-primary {
  background: linear-gradient(135deg, hsl(270, 60%, 50%), hsl(240, 60%, 55%));
  color: white;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px hsla(270, 60%, 50%, 0.35);
}
.btn-secondary {
  background: hsla(260, 30%, 30%, 0.4);
  color: var(--text-secondary);
  border: 1px solid var(--panel-border);
}
.btn-secondary:hover {
  color: var(--text-primary);
  border-color: var(--accent-blue);
}
.btn svg {
  width: 15px;
  height: 15px;
}

/* Right Panel */
#right-panel {
  position: fixed;
  right: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 340px;
  max-height: 70vh;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 1rem;
  padding: 1.5rem;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
  overflow-y: auto;
}
#right-panel.collapsed {
  transform: translateY(-50%) translateX(calc(100% + 2rem));
  opacity: 0;
  pointer-events: none;
}
#right-panel::-webkit-scrollbar { width: 4px; }
#right-panel::-webkit-scrollbar-thumb { background: hsla(260, 30%, 40%, 0.4); border-radius: 2px; }
.detail-empty {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
  padding: 2rem 0;
}
.detail-empty svg {
  width: 40px;
  height: 40px;
  margin: 0 auto 1rem;
  opacity: 0.4;
}
.detail-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}
.detail-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
}
.detail-name {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.detail-type {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.detail-section {
  margin-bottom: 1rem;
}
.detail-section-title {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
}
.detail-text {
  font-size: 0.82rem;
  line-height: 1.7;
  color: var(--text-secondary);
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.detail-tag {
  font-size: 0.7rem;
  padding: 0.25rem 0.65rem;
  border-radius: 1rem;
  background: hsla(260, 30%, 35%, 0.3);
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}
.detail-tag.warm { background: hsla(25, 70%, 50%, 0.2); color: hsl(25, 70%, 70%); }
.detail-tag.cool { background: hsla(210, 60%, 50%, 0.2); color: hsl(210, 60%, 70%); }
.detail-tag.neutral { background: hsla(260, 20%, 40%, 0.2); color: hsl(260, 20%, 70%); }
.detail-tag.source-tag { background: hsla(42, 80%, 55%, 0.15); color: hsl(42, 70%, 70%); }

/* Detail Actions */
.detail-actions {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--panel-border);
}
.detail-action-btn {
  width: 100%;
  padding: 0.65rem 1rem;
  background: linear-gradient(135deg, hsla(260, 60%, 45%, 0.3), hsla(280, 50%, 40%, 0.3));
  border: 1px solid hsla(260, 50%, 50%, 0.4);
  border-radius: 0.65rem;
  color: var(--text-primary);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}
.detail-action-btn:hover {
  background: linear-gradient(135deg, hsla(260, 60%, 50%, 0.4), hsla(280, 50%, 45%, 0.4));
  border-color: hsla(260, 50%, 60%, 0.5);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px hsla(260, 50%, 40%, 0.3);
}
.detail-action-btn svg {
  width: 14px;
  height: 14px;
}

/* Settings Tabs */
.settings-tab.active {
  color: #4fc3f7 !important;
  border-bottom-color: #4fc3f7 !important;
}

.detail-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: hsla(260, 20%, 30%, 0.4);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.detail-close:hover { color: var(--text-primary); background: hsla(0, 60%, 50%, 0.3); }

/* Bottom Panel */
#bottom-panel {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: min(720px, 90vw);
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-bottom: none;
  border-radius: 1rem 1rem 0 0;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
#bottom-panel.collapsed {
  transform: translateX(-50%) translateY(calc(100% - 3rem));
}
.bottom-toggle {
  width: 100%;
  padding: 0.75rem;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  transition: color 0.2s;
}
.bottom-toggle:hover { color: var(--text-primary); }
.bottom-toggle svg { width: 16px; height: 16px; transition: transform 0.3s; }
#bottom-panel:not(.collapsed) .bottom-toggle svg { transform: rotate(180deg); }
.bottom-content {
  padding: 0 1.5rem 1.5rem;
  max-height: 40vh;
  overflow-y: auto;
}
.bottom-content::-webkit-scrollbar { width: 4px; }
.bottom-content::-webkit-scrollbar-thumb { background: hsla(260, 30%, 40%, 0.4); border-radius: 2px; }
.analysis-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
@media (max-width: 640px) {
  .analysis-grid { grid-template-columns: 1fr; }
}
.analysis-card {
  background: hsla(240, 20%, 12%, 0.5);
  border: 1px solid var(--panel-border);
  border-radius: 0.75rem;
  padding: 1rem;
}
.analysis-card h4 {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--accent-gold);
  margin: 0 0 0.5rem;
}
.analysis-card p, .analysis-card li {
  font-size: 0.78rem;
  line-height: 1.65;
  color: var(--text-secondary);
  margin: 0;
}
.analysis-card ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.analysis-card li {
  padding: 0.3rem 0;
  border-bottom: 1px solid hsla(260, 20%, 30%, 0.2);
}
.analysis-card li:last-child { border-bottom: none; }
.analysis-card li::before {
  content: '·';
  color: var(--accent-purple);
  margin-right: 0.5rem;
  font-weight: bold;
}

/* Time Controls */
#time-controls {
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--panel-border);
}
.tc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}
.tc-header-label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--accent-gold);
}
.tc-header-label svg { width: 14px; height: 14px; }
.tc-speed-group {
  display: flex;
  gap: 0.2rem;
  background: hsla(240, 20%, 12%, 0.6);
  border: 1px solid var(--panel-border);
  border-radius: 0.5rem;
  padding: 0.15rem;
}
.tc-speed-btn {
  padding: 0.25rem 0.55rem;
  border: none;
  border-radius: 0.35rem;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Serif SC', serif;
}
.tc-speed-btn:hover { color: var(--text-secondary); }
.tc-speed-btn.active {
  background: hsla(42, 85%, 60%, 0.15);
  color: var(--accent-gold);
}
.tc-slider-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.tc-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: hsla(260, 30%, 35%, 0.4);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.tc-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
  border: 2px solid hsla(260, 30%, 20%, 0.8);
  cursor: pointer;
  box-shadow: 0 0 8px hsla(270, 60%, 50%, 0.4);
}
.tc-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
  border: 2px solid hsla(260, 30%, 20%, 0.8);
  cursor: pointer;
}
.tc-time-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  min-width: 2.5rem;
  text-align: center;
}

/* Celestial Labels */
.celestial-label {
  color: #ccd6e8;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-shadow: 0 0 10px rgba(100, 150, 255, 0.5), 0 0 4px rgba(100, 120, 200, 0.3);
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  white-space: nowrap;
  transition: opacity 0.3s ease;
}
.celestial-label.planet-label {
  font-size: 10px;
  font-weight: 400;
  text-shadow: 0 0 6px rgba(150, 200, 255, 0.35);
}
.celestial-label.hidden {
  opacity: 0;
}

/* Tooltip */
#tooltip {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 0.65rem;
  padding: 0.6rem 0.9rem;
  font-size: 0.78rem;
  color: var(--text-primary);
  opacity: 0;
  transition: opacity 0.2s;
  white-space: nowrap;
  letter-spacing: 0.04em;
}
#tooltip.visible { opacity: 1; }
#tooltip .tt-name { font-weight: 600; }
#tooltip .tt-type { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.15rem; }

/* Responsive */
@media (max-width: 768px) {
  #left-panel { width: 280px; left: 0.75rem; }
  #right-panel { width: 280px; right: 0.75rem; }
  .top-title { font-size: 0.95rem; }
  .loading-title { font-size: 1.5rem; }
}
@media (max-width: 480px) {
  #left-panel { width: 260px; left: 0.5rem; padding: 1rem; }
  #right-panel { width: 260px; right: 0.5rem; padding: 1rem; }
  #top-bar { padding: 0.75rem; }
  .top-title { display: none; }
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-title">心智星系</div>
  <div class="loading-subtitle">MIND GALAXY</div>
  <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>
  <div class="loading-percent" id="loading-percent">0%</div>
</div>

<!-- Canvas -->
<div id="canvas-container"></div>

<!-- Top Bar -->
<div id="top-bar">
  <div class="top-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" opacity="0.4"/>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2" opacity="0.5"/>
      <circle cx="5" cy="5" r="1.5" opacity="0.6"/><circle cx="19" cy="19" r="1" opacity="0.4"/>
      <circle cx="19" cy="7" r="1.2" opacity="0.5"/>
    </svg>
    <span class="top-title">心智星系 Mind Galaxy</span>
  </div>
  <div class="top-controls">
    <button class="ctrl-btn" title="返回心迹星图" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/><polyline points="9,18 3,12 9,6"/></svg>
      <span class="ctrl-tooltip">返回</span>
    </button>
    <button class="ctrl-btn active" id="btn-play" title="暂停/播放">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6,4 20,12 6,20"/></svg>
      <span class="ctrl-tooltip">播放</span>
    </button>
    <button class="ctrl-btn" id="btn-view-full" title="全景视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="ctrl-tooltip">全景</span>
    </button>
    <button class="ctrl-btn active" id="btn-orbits" title="轨道线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="4"/></svg>
      <span class="ctrl-tooltip">轨道</span>
    </button>
    <button class="ctrl-btn active" id="btn-labels" title="标签">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="8" rx="2"/><line x1="12" y1="11" x2="12" y2="21"/></svg>
      <span class="ctrl-tooltip">标签</span>
    </button>
    <button class="ctrl-btn" id="btn-reset" title="重置视角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="12,6 12,14 16,10"/></svg>
      <span class="ctrl-tooltip">重置</span>
    </button>
    <button class="ctrl-btn" id="btn-export-image" title="导出截图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="ctrl-tooltip">截图</span>
    </button>
    <button class="ctrl-btn" id="btn-export-json" title="导出数据 (JSON)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span class="ctrl-tooltip">导出数据</span>
    </button>
    <button class="ctrl-btn" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="ctrl-tooltip">设置</span>
    </button>
  </div>
</div>

<!-- Left Panel -->
<div id="left-panel">
  <button class="panel-toggle" id="left-toggle" title="折叠面板">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
  </button>
  <div class="panel-label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    心智星系 · 数据导入
  </div>

  <!-- 数据来源选择 -->
  <div class="data-source-section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      选择数据来源
    </div>
    <div class="data-source-buttons">
      <button class="data-source-btn" id="btn-import-notes" title="从我的日记生成星系">
        <span class="ds-icon">📝</span>
        <span class="ds-label">日记星系</span>
      </button>
      <button class="data-source-btn" id="btn-import-kb" title="从知识库生成星系">
        <span class="ds-icon">📚</span>
        <span class="ds-label">知识星系</span>
      </button>
      <button class="data-source-btn" id="btn-import-mixed" title="混合日记和知识库">
        <span class="ds-icon">🌌</span>
        <span class="ds-label">融合星系</span>
      </button>
    </div>
    <div class="import-status" id="import-status" style="display:none;">
      <span class="loading-dot"></span>
      <span id="import-status-text">正在生成星系...</span>
    </div>
  </div>

  <div class="divider">
    <span>或手动输入</span>
  </div>

  <textarea id="diary-input" placeholder="在这里写下你的日记、感悟或思考...&#10;&#10;例如：今天在工作中遇到了一个难题，我发现自己总是习惯性地逃避困难的任务。但这次我决定直面它，花了3个小时深入研究，最终找到了解决方案。这种突破自我的感觉真好..."></textarea>
  <div id="analyzer-preview">
    <div class="ap-warning" id="ap-warning" style="display:none;"></div>
    <div class="ap-section">
      <div class="ap-section-title">关键词</div>
      <div class="ap-keywords" id="ap-keywords"></div>
    </div>
    <div class="ap-section">
      <div class="ap-section-title">情绪光谱</div>
      <div class="ap-emotions" id="ap-emotions"></div>
    </div>
    <div class="ap-char-count" id="ap-char-count"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btn-analyze">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      分析并生成星系
    </button>
    <button class="btn btn-secondary" id="btn-example">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5,12 3,12 12,3 21,12 19,12"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
      示例
    </button>
  </div>
</div>

<!-- Right Panel -->
<div id="right-panel" class="collapsed">
  <button class="detail-close" id="detail-close">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="detail-empty" id="detail-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
    <p>点击星系中的星体<br>查看心智详情</p>
  </div>
  <div id="detail-content" style="display:none;"></div>
</div>

<!-- Bottom Panel -->
<div id="bottom-panel" class="collapsed">
  <button class="bottom-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
    心智分析与成长建议
  </button>
  <div class="bottom-content" id="bottom-content">
    <div id="time-controls">
      <div class="tc-header">
        <div class="tc-header-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          时间演化
        </div>
        <div class="tc-speed-group">
          <button class="tc-speed-btn" data-speed="0.25">慢</button>
          <button class="tc-speed-btn active" data-speed="0.5">中</button>
          <button class="tc-speed-btn" data-speed="1.0">快</button>
        </div>
      </div>
      <div class="tc-slider-row">
        <span class="tc-time-label" id="tc-time-current">0.0s</span>
        <input type="range" class="tc-slider" id="time-slider" min="0" max="1000" value="0">
        <span class="tc-time-label" id="tc-time-total">10.0s</span>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip"><div class="tt-name"></div><div class="tt-type"></div></div>

<script type="module">
  import { mountMindGalaxy } from './js/modules/mindGalaxy/index.js';
  mountMindGalaxy();
</script>
</body>
</html>
